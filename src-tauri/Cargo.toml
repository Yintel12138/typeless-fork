[package]
name = "typeless"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
cpal = "0.15"
hound = "3"
arboard = "3"
rdev = "0.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
async-trait = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
